# Shared settings for every profile.
# Profile-specific values live in application-dev.yml and application-prod.yml.
server:
  port: 8080

application:
  security:
    jwt:
      expiration: 900000        # 15 minutes in ms (access token)
      refresh-expiration: 604800000  # 7 days in ms (refresh token)
  storage:
    s3:
      bucket: ${S3_BUCKET:topwatch-images}
      region: ${AWS_REGION:us-east-2}
      public-base-url: ${S3_PUBLIC_URL:https://topwatch-images.s3.us-east-2.amazonaws.com}

spring:
  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set
    default: dev
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
