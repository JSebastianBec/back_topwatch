swagger: '2.0'
info:
  title: TopWatch API
  description: Auth and user management endpoints for the back_topwatch service, for
    import into Mockoon (Environment creation menu > New local environment from OpenAPI/Swagger).
  version: 1.0.0
host: localhost:8080
basePath: /
schemes:
- http
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: 'Send as: Bearer <token>'
definitions:
  RegisterRequest:
    type: object
    required:
    - email
    - password
    - nickname
    properties:
      email:
        type: string
      password:
        type: string
      nickname:
        type: string
  LoginRequest:
    type: object
    required:
    - email
    - password
    properties:
      email:
        type: string
      password:
        type: string
  LogoutRequest:
    type: object
    properties:
      refreshToken:
        type: string
  UpdateUserRequest:
    type: object
    properties:
      name:
        type: string
      lastname:
        type: string
      nickname:
        type: string
      gender:
        type: string
        enum:
        - MALE
        - FEMALE
        - OTHER
        - NOT_SAYED
      email:
        type: string
      password:
        type: string
      avatarURL:
        type: string
  AuthResponse:
    type: object
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
  Authority:
    type: object
    properties:
      authority:
        type: string
  User:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      lastname:
        type: string
      nickname:
        type: string
      gender:
        type: string
        enum:
        - MALE
        - FEMALE
        - OTHER
        - NOT_SAYED
      email:
        type: string
      role:
        type: string
        enum:
        - USER
        - ADMIN
      avatarURL:
        type: string
      username:
        type: string
      authorities:
        type: array
        items:
          $ref: '#/definitions/Authority'
      accountNonExpired:
        type: boolean
      accountNonLocked:
        type: boolean
      credentialsNonExpired:
        type: boolean
      enabled:
        type: boolean
  ErrorMessage:
    type: object
    properties:
      message:
        type: string
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Register user
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/AuthResponse'
          examples:
            application/json:
              accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzZWJhc0B0b3B3YXRjaC5jb20iLCJqdGkiOiJhMWIyYzNkNC1lNWY2LTc4OTAtYWJjZC1lZjEyMzQ1Njc4OTAiLCJpYXQiOjE3NTUzMDAwMDAsImV4cCI6MTc1NTMwMDkwMH0.EXAMPLE-SIGNATURE-1
              refreshToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzZWJhc0B0b3B3YXRjaC5jb20iLCJqdGkiOiJmNmU1ZDQtYzNiMi1hMTAwLTk4NzYtNTQzMjEwZmVkY2JhIiwiaWF0IjoxNzU1MzAwMDAwLCJleHAiOjE3NTU5MDQ4MDB9.EXAMPLE-SIGNATURE-2
        '409':
          description: Conflict - email or nickname already in use
          schema:
            $ref: '#/definitions/ErrorMessage'
          examples:
            application/json:
              message: Email or nickname is already in use
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/AuthResponse'
          examples:
            application/json:
              accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzZWJhc0B0b3B3YXRjaC5jb20iLCJqdGkiOiJhMWIyYzNkNC1lNWY2LTc4OTAtYWJjZC1lZjEyMzQ1Njc4OTAiLCJpYXQiOjE3NTUzMDAwMDAsImV4cCI6MTc1NTMwMDkwMH0.EXAMPLE-SIGNATURE-1
              refreshToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzZWJhc0B0b3B3YXRjaC5jb20iLCJqdGkiOiJmNmU1ZDQtYzNiMi1hMTAwLTk4NzYtNTQzMjEwZmVkY2JhIiwiaWF0IjoxNzU1MzAwMDAwLCJleHAiOjE3NTU5MDQ4MDB9.EXAMPLE-SIGNATURE-2
        '401':
          description: Unauthorized - bad credentials
          schema:
            $ref: '#/definitions/ErrorMessage'
          examples:
            application/json:
              message: Bad credentials
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh tokens
      description: The refresh token (not the access token) is sent as a Bearer token
        in the Authorization header.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/AuthResponse'
          examples:
            application/json:
              accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzZWJhc0B0b3B3YXRjaC5jb20iLCJqdGkiOiJhYWJiY2NkZC0xMTIyLTMzNDQtNTU2Ni03Nzg4OTlhYWJiY2MiLCJpYXQiOjE3NTUzMDA5MDAsImV4cCI6MTc1NTMwMTgwMH0.EXAMPLE-SIGNATURE-3
              refreshToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzZWJhc0B0b3B3YXRjaC5jb20iLCJqdGkiOiJkZGVlZmYwMC0zMzQ0LTU1NjYtNzc4OC05OWFhYmJjY2RkZWUiLCJpYXQiOjE3NTUzMDA5MDAsImV4cCI6MTc1NTkwNTcwMH0.EXAMPLE-SIGNATURE-4
        '401':
          description: Unauthorized - missing header, invalid or revoked refresh token
          schema:
            $ref: '#/definitions/ErrorMessage'
          examples:
            application/json:
              message: Refresh token has been revoked
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Revokes the access token in the Authorization header and, optionally,
        the refresh token in the body.
      security:
      - bearerAuth: []
      parameters:
      - name: body
        in: body
        required: false
        schema:
          $ref: '#/definitions/LogoutRequest'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized - missing Authorization header
  /api/v1/users/health:
    get:
      tags:
      - Users
      summary: Health check
      produces:
      - text/plain
      responses:
        '200':
          description: OK
          schema:
            type: string
          examples:
            text/plain: Hello world
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: Get current user
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/User'
          examples:
            application/json:
              id: 1
              name: null
              lastname: null
              nickname: sebas
              gender: null
              email: sebas@topwatch.com
              role: USER
              avatarURL: null
              username: sebas@topwatch.com
              authorities:
              - authority: ROLE_USER
              accountNonExpired: true
              accountNonLocked: true
              credentialsNonExpired: true
              enabled: true
    patch:
      tags:
      - Users
      summary: Update current user
      security:
      - bearerAuth: []
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateUserRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/User'
          examples:
            application/json:
              id: 1
              name: Sebastian
              lastname: Becerra
              nickname: sebas
              gender: MALE
              email: sebas@topwatch.com
              role: USER
              avatarURL: https://cdn.topwatch.com/avatars/sebas.png
              username: sebas@topwatch.com
              authorities:
              - authority: ROLE_USER
              accountNonExpired: true
              accountNonLocked: true
              credentialsNonExpired: true
              enabled: true
        '409':
          description: Conflict - nickname or email already in use
          schema:
            $ref: '#/definitions/ErrorMessage'
          examples:
            application/json:
              message: Nickname is already in use
  /api/v1/users/users:
    get:
      tags:
      - Users
      summary: Return all users
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/User'
          examples:
            application/json:
            - id: 1
              name: Sebastian
              lastname: Becerra
              nickname: sebas
              gender: MALE
              email: sebas@topwatch.com
              role: USER
              avatarURL: null
              username: sebas@topwatch.com
              authorities:
              - authority: ROLE_USER
              accountNonExpired: true
              accountNonLocked: true
              credentialsNonExpired: true
              enabled: true
            - id: 2
              name: null
              lastname: null
              nickname: otheruser
              gender: null
              email: other@topwatch.com
              role: USER
              avatarURL: null
              username: other@topwatch.com
              authorities:
              - authority: ROLE_USER
              accountNonExpired: true
              accountNonLocked: true
              credentialsNonExpired: true
              enabled: true
  /api/v1/users/user/{id}:
    get:
      tags:
      - Users
      summary: Get given user
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        format: int64
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/User'
          examples:
            application/json:
              id: 1
              name: Sebastian
              lastname: Becerra
              nickname: sebas
              gender: MALE
              email: sebas@topwatch.com
              role: USER
              avatarURL: null
              username: sebas@topwatch.com
              authorities:
              - authority: ROLE_USER
              accountNonExpired: true
              accountNonLocked: true
              credentialsNonExpired: true
              enabled: true
        '404':
          description: Not Found
  /api/v1/users/delete/{id}:
    post:
      tags:
      - Users
      summary: Delete current user
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        format: int64
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
